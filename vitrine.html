<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoshflow - Vitrine</title>
    <style>
        :root {
            --cor-principal: #1e3a8a;
            --cor-secundaria: #0f172a;
            --cor-fundo: #f0f4f8;
            --cor-card: #ffffff;
            --cor-borda: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--cor-fundo);
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Moldura principal que se adapta: tela cheia em celulares, mas elegante em tablets/notebooks */
        .app-container {
            width: 100%;
            max-width: 900px; /* Aumentado para aproveitar melhor telas maiores */
            background-color: var(--cor-card);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .conteudo-principal {
            padding: 20px;
            flex: 1;
        }

        .topo-vitrine {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--cor-borda);
            padding-bottom: 15px;
        }

        .topo-vitrine h2 {
            color: var(--cor-principal);
            font-size: 22px;
        }

        /* Categorias / Filtros */
        .categorias {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .categoria-btn {
            background-color: var(--cor-fundo);
            border: 1px solid var(--cor-borda);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--cor-secundaria);
            font-weight: bold;
        }

        .categoria-btn.ativo {
            background-color: var(--cor-principal);
            color: white;
            border-color: var(--cor-principal);
        }

        /* Seção de Destaques e Livros */
        .secao-titulo {
            font-size: 18px;
            color: var(--cor-secundaria);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .grid-livros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card-livro {
            background-color: var(--cor-fundo);
            border: 1px solid var(--cor-borda);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .capa-livro {
            width: 100%;
            height: 140px;
            background-color: #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .livro-info h3 {
            font-size: 16px;
            color: var(--cor-secundaria);
            margin-bottom: 5px;
        }

        .livro-info p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .botao-ler {
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .botao-ler:hover {
            opacity: 0.9;
        }

        /* Menu Inferior Fixo */
        .menu-inferior {
            display: flex;
            justify-content: space-around;
            background-color: #ffffff;
            border-top: 1px solid var(--cor-borda);
            padding: 12px 0;
            position: sticky;
            bottom: 0;
        }

        .menu-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .menu-item.ativo {
            color: var(--cor-principal);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="conteudo-principal">
            <!-- Topo -->
            <div class="topo-vitrine">
                <h2>Kadoshflow</h2>
                <button onclick="window.location.href='admin.html'" style="background:none; border:none; cursor:pointer; font-size: 20px;" title="Perfil / Admin">👤</button>
            </div>

            <!-- Abas de Categorias -->
            <div class="categorias">
                <button class="categoria-btn ativo">🔥 HOT</button>
                <button class="categoria-btn">⭐ RANK</button>
                <button class="categoria-btn">📚 Livros</button>
                <button class="categoria-btn">👶 Infantil</button>
                <button class="categoria-btn">📖 EBD</button>
                <button class="categoria-btn">👑 VIP / Completo</button>
            </div>

            <!-- Destaques -->
            <div class="secao-titulo">🔥 Destaques</div>
            
            <div class="grid-livros">
                <div class="card-livro">
                    <div class="capa-livro">Capa do Livro</div>
                    <div class="livro-info">
                        <h3>Amor no Altar</h3>
                        <p>Por Sara Lima</p>
                    </div>
                    <button class="botao-ler" onclick="window.location.href='detalhe.html'">Ler Obra</button>
                </div>
            </div>
        </div>

        <!-- Menu de Navegação Inferior -->
        <div class="menu-inferior">
            <button class="menu-item" onclick="window.location.href='carteira.html'">📚 Biblioteca</button>
            <button class="menu-item ativo" onclick="window.location.href='vitrine.html'">🏠 Início</button>
            <button class="menu-item" onclick="window.location.href='detalhe.html'">👑 VIP</button>
            <button class="menu-item" onclick="window.location.href='admin.html'">👤 Perfil</button>
        </div>
    </div>

</body>
</html>
