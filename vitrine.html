<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine - Kadosh</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f9f9f9; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        nav { display: flex; justify-content: center; background: #34495e; padding: 10px; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; cursor: pointer; }
        nav a:hover { color: #f39c12; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: white; border-radius: 6px; }
        .grid-livros { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-livro { border: 1px solid #ddd; border-radius: 6px; padding: 15px; text-align: center; background: #fff; }
        .card-livro img { width: 120px; height: 160px; background: #ccc; margin-bottom: 10px; object-fit: cover; }
        .botoes-acao { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .botoes-acao button { padding: 6px; font-size: 12px; cursor: pointer; border: none; border-radius: 3px; background: #3498db; color: white; }
        .botoes-acao button:hover { background: #2980b9; }
        .botoes-acao button.comprar { background: #e67e22; }
        .botoes-acao button.comprar:hover { background: #d35400; }
    </style>
</head>
<body>

<header>
    <h1>Vitrine Kadosh</h1>
</header>

<nav>
    <a onclick="filtrar('todos')">Todos os Livros</a>
    <a onclick="filtrar('infantil')">Livros Infantis</a>
    <a onclick="filtrar('devocionais')">Devocionais</a>
    <a onclick="filtrar('materiais')">Materiais Infantis</a>
</nav>

<div class="container">
    <h2 id="tituloCategoria">Todos os Livros e Obras</h2>
    
    <div class="grid-livros" id="catalogo">
        <!-- Livro Adulto Exemplo -->
        <div class="card-livro" data-tipo="adulto">
            <div style="width:120px; height:160px; background:#ddd; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:12px;">Capa Adulto</div>
            <h3>O Trono de Cristal</h3>
            <p>Categoria: Adulto</p>
            <div class="botoes-acao">
                <button onclick="lerObra('O Trono de Cristal')">Ler Obra</button>
                <button class="comprar" onclick="comprarObra('O Trono de Cristal')">Comprar Obra</button>
                <button class="comprar" onclick="comprarPaginas('O Trono de Cristal')">Comprar Páginas</button>
            </div>
        </div>

        <!-- Livro Infantil Exemplo -->
        <div class="card-livro" data-tipo="infantil">
            <div style="width:120px; height:160px; background:#fce4ec; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:12px;">Capa Infantil</div>
            <h3>Cantinho das Histórias</h3>
            <p>Categoria: Infantil</p>
            <div class="botoes-acao">
                <button onclick="lerObra('Cantinho das Histórias')">Ler Obra</button>
                <button class="comprar" onclick="comprarObra('Cantinho das Histórias')">Comprar Obra</button>
            </div>
        </div>

        <!-- Devocional Exemplo -->
        <div class="card-livro" data-tipo="devocionais">
            <div style="width:120px; height:160px; background:#e8f5e9; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:12px;">Capa Devocional</div>
            <h3>Devocional Diário</h3>
            <p>Categoria: Devocionais</p>
            <div class="botoes-acao">
                <button onclick="lerObra('Devocional Diário')">Acessar / Ler</button>
            </div>
        </div>
    </div>
</div>

<script>
    function filtrar(tipo) {
        const livros = document.querySelectorAll('.card-livro');
        const titulo = document.getElementById('tituloCategoria');
        
        titulo.innerText = tipo === 'todos' ? 'Todos os Livros e Obras' : `Categoria: ${tipo.toUpperCase()}`;

        livros.forEach(livro => {
            if (tipo === 'todos' || livro.getAttribute('data-tipo') === tipo) {
                livro.style.display = 'block';
            } else {
                livro.style.display = 'none';
            }
        });
    }

    function lerObra(nome) {
        alert(`Abrindo o modo de leitura para: ${nome}`);
    }

    function comprarObra(nome) {
        alert(`Redirecionando para compra completa da obra: ${nome} (Via Pix / Sistema)`);
    }

    function comprarPaginas(nome) {
        alert(`Opção de comprar páginas avulsas selecionada para: ${nome}`);
    }
</script>

</body>
</html>
