<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoshflow - Vitrine</title>
    <style>
        :root {
            --cor-principal: #1e3a8a;
            --cor-secundaria: #0f172a;
            --cor-fundo: #ffffff;
            --cor-card: #f8fafc;
            --cor-borda: #e2e8f0;
            --cor-azul-claro: #e0f2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--cor-fundo);
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.03);
        }

        .conteudo-principal {
            padding: 20px;
            flex: 1;
        }

        .topo-vitrine {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--cor-borda);
            padding-bottom: 15px;
        }

        .topo-vitrine h2 {
            color: var(--cor-principal);
            font-size: 24px;
        }

        /* Badge VIP Dinâmico */
        .badge-status-vip {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--cor-borda);
            cursor: pointer;
        }

        .badge-status-vip.vip-ativo {
            background-color: #fef3c7;
            color: #92400e;
            border-color: #fcd34d;
        }

        /* Categorias Funcionais */
        .categorias {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .categoria-btn {
            background-color: var(--cor-azul-claro);
            border: 1px solid #bae6fd;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--cor-principal);
            font-weight: bold;
            transition: all 0.2s;
        }

        .categoria-btn.ativo, .categoria-btn:hover {
            background-color: var(--cor-principal);
            color: white;
            border-color: var(--cor-principal);
        }

        .secao-titulo {
            font-size: 18px;
            color: var(--cor-secundaria);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .grid-livros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .card-livro {
            background-color: var(--cor-card);
            border: 1px solid var(--cor-borda);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .capa-livro {
            width: 100%;
            height: 160px;
            background-color: #e2e8f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .livro-info h3 {
            font-size: 16px;
            color: var(--cor-secundaria);
            margin-bottom: 4px;
        }

        .livro-info .autor {
            font-size: 13px;
            color: var(--cor-principal);
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Sistema de Estrelas Graduais (Substituindo o botão comum) */
        .estrelas-leitores {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 10px;
            color: #eab308;
            font-size: 14px;
            cursor: pointer;
        }

        .botao-ler {
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .menu-inferior {
            display: flex;
            justify-content: space-around;
            background-color: #ffffff;
            border-top: 1px solid var(--cor-borda);
            padding: 12px 0;
            position: sticky;
            bottom: 0;
        }

        .menu-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .menu-item.ativo {
            color: var(--cor-principal);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="conteudo-principal">
            <div class="topo-vitrine">
                <h2>Kadoshflow</h2>
                <div id="statusVipBadge" class="badge-status-vip" onclick="window.location.href='detalhe.html'">
                    ⭐ Não VIP
                </div>
            </div>

            <!-- Categorias Funcionais -->
            <div class="categorias">
                <button class="categoria-btn ativo" onclick="filtrarCategoria(this, 'Destaques')">🔥 Destaques</button>
                <button class="categoria-btn" onclick="filtrarCategoria(this, 'Rank')">⭐ Rank</button>
                <button class="categoria-btn" onclick="filtrarCategoria(this, 'Livros')">📚 Livros</button>
                <button class="categoria-btn" onclick="filtrarCategoria(this, 'Infantil')">👶 Infantil</button>
                <button class="categoria-btn" onclick="filtrarCategoria(this, 'EBD')">📖 EBD</button>
                <button class="categoria-btn" onclick="filtrarCategoria(this, 'VIP')">👑 VIP</button>
            </div>

            <div class="secao-titulo" id="tituloSecao">🔥 Obras em Destaque</div>
            
            <div class="grid-livros">
                <div class="card-livro">
                    <div class="capa-livro">Capa</div>
                    <div class="livro-info">
                        <h3>Caminho da Luz</h3>
                        <p class="autor">Por Felipe</p>
                        <!-- Estrelas baseadas em leitores -->
                        <div class="estrelas-leitores" title="Baseado na quantidade de leitores">
                            ⭐⭐⭐⭐☆ <span style="font-size: 11px; color: #64748b;">(45 leitores)</span>
                        </div>
                    </div>
                    <button class="botao-ler" onclick="window.location.href='detalhe.html'">Ler Obra</button>
                </div>
            </div>
        </div>

        <div class="menu-inferior">
            <button class="menu-item" onclick="window.location.href='carteira.html'">📚 Biblioteca</button>
            <button class="menu-item ativo" onclick="window.location.href='vitrine.html'">🏠 Início</button>
            <button class="menu-item" onclick="window.location.href='detalhe.html'">👑 VIP</button>
            <button class="menu-item" onclick="window.location.href='admin.html'">👤 Perfil</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const statusVip = localStorage.getItem('kadoshflow_status_vip');
            const badge = document.getElementById('statusVipBadge');
            if(statusVip === 'ativo') {
                badge.textContent = "👑 VIP Confirmado";
                badge.classList.add('vip-ativo');
            } else {
                badge.textContent = "⭐ Não VIP";
                badge.classList.remove('vip-ativo');
            }
        };

        function filtrarCategoria(botao, categoria) {
            document.querySelectorAll('.categoria-btn').forEach(b => b.classList.remove('ativo'));
            botao.classList.add('ativo');
            document.getElementById('tituloSecao').textContent = "Categoria selecionada: " + categoria;
        }
    </script>
</body>
</html>
