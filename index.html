<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoshflow - Início</title>
    <style>
        :root {
            --cor-principal: #1e3a8a;
            --cor-secundaria: #0f172a;
            --cor-fundo: #f0f4f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: var(--cor-fundo);
        }

        /* Container que ocupa a tela inteira em qualquer dispositivo */
        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: var(--cor-principal);
        }

        /* Estilo da Logo adaptável para ficar grandona e elegante */
        .logo-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .logo-container img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Botão de Entrar estilizado */
        .botao-entrar {
            background-color: #ffffff;
            color: var(--cor-principal);
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        .botao-entrar:hover {
            background-color: #f8fafc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-container">
            <!-- Certifique-se de que o nome da imagem está idêntico: logo.jpg -->
            <img src="logo.jpg" alt="Logo Kadoshflow">
            <h1>Kadoshflow</h1>
            <p>Sua plataforma de leitura e histórias.</p>
            
            <button class="botao-entrar" onclick="window.location.href='vitrine.html'">Entrar no App</button>
        </div>
    </div>

</body>
</html>
