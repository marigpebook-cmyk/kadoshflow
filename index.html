<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoshflow - Início</title>
    <style>
        :root {
            --cor-principal: #1e3a8a;
            --cor-secundaria: #0f172a;
            --cor-fundo: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Capa Inicial de Apresentação */
        .tela-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            cursor: pointer;
            padding: 20px;
        }

        .logo-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 450px;
            max-height: 70vh;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .significado-capa {
            text-align: center;
            color: #94a3b8;
            width: 100%;
            padding: 5px;
        }

        .significado-capa h3 {
            color: #f8fafc;
            font-size: 16px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .significado-capa p {
            font-size: 13px;
            color: #38bdf8;
            font-style: italic;
        }

        .legenda-capa {
            color: #64748b;
            width: 100%;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1.5px;
        }

        .esconder-capa {
            display: none !important;
        }

        /* Painel de Login / Cadastro */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: var(--cor-fundo);
        }

        .painel-acesso {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #cbd5e1;
        }

        .painel-acesso h2 {
            color: var(--cor-principal);
            margin-bottom: 5px;
            font-size: 24px;
        }

        .sub-significado {
            font-size: 12px;
            color: #0284c7;
            font-style: italic;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .input-grupo {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-grupo label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-grupo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .botao-acao {
            width: 100%;
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .links-uteis {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
        }

        .links-uteis span {
            color: var(--cor-principal);
            font-weight: bold;
            cursor: pointer;
        }

        .escondido {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Capa Inicial de Entrada -->
    <div class="tela-capa" id="telaCapa" onclick="entrarNoApp()">
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Kadoshflow Capa">
        </div>
        <div class="significado-capa">
            <h3>KADOSHFLOW</h3>
            <p>Consagrado e Separado</p>
        </div>
        <div class="legenda-capa">Toque na tela para entrar &bull; Leitura &bull; Materiais</div>
    </div>

    <!-- Painel de Login -->
    <div class="app-container" id="painelContainer">
        <div class="painel-acesso">
            <div id="formEntrar">
                <h2>Kadoshflow</h2>
                <div class="sub-significado">Consagrado e Separado</div>
                
                <div class="input-grupo">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                <div class="input-grupo">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Sua senha">
                </div>
                
                <button class="botao-acao" onclick="realizarLogin()">Entrar</button>

                <div class="links-uteis">
                    <span onclick="window.location.href='vitrine.html'">Pular direto para a Vitrine (Modo Visitante)</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function entrarNoApp() {
            document.getElementById('telaCapa').classList.add('esconder-capa');
        }

        function realizarLogin() {
            const email = document.getElementById('loginEmail').value;
            if(email) {
                localStorage.setItem('kadoshflow_email', email);
            }
            window.location.href = 'vitrine.html';
        }
    </script>
</body>
</html>
