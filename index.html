<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoshflow - Portal Cristão</title>
    <style>
       :root {
--cor-principal: #1e3a8a;   /* Azul-marinho principal elegante /
--cor-secundaria: #0f172a;  / Azul-marinho bem escuro para títulos fortes /
--cor-fundo: #f0f4f8;       / Cinza levemente azulado (fundo moderno e limpo) /
--cor-card: #ffffff;        / Branco puro para os blocos /
--cor-borda: #cbd5e1;       / Cinza suave para contornos e separações /
--cor-vip: #d97706;         / Dourado elegante para áreas VIP /
--cor-admin: #047857;       / Verde profissional para o painel admin */
}
        body {
            font-family: Arial, sans-serif;
            background-color: var(--cor-fundo);
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--cor-card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(140, 109, 120, 0.12);
            border: 1px solid var(--cor-borda);
            text-align: center;
        }
        #tela-splash {
            padding: 40px 20px;
        }
        .botao-iniciar {
            background-color: var(--cor-principal);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div id="tela-splash">
        <!-- Cole o link da sua imagem no lugar de COLE_O_LINK_AQUI -->
        <img src="COLE_O_LINK_AQUI" alt="Logo Kadoshflow" style="width: 170px; height: 170px; border-radius: 50%; object-fit: cover; border: 3px solid var(--cor-vip); box-shadow: 0 4px 15px rgba(0,0,0,0.15); margin-bottom: 15px;">
        <h2 style="color: var(--cor-secundaria); margin-bottom: 5px;">Kadoshflow</h2>
        <p style="color: var(--cor-principal); font-size: 13px;">Portal de Leitura, EBD e Edificação Cristã</p>
        <button class="botao-iniciar" onclick="window.location.href='vitrine.html'">Iniciar Aplicativo</button>
    </div>
</div>
</body>
</html>
