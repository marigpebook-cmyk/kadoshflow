<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoshflow - Início</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #000000;
            overflow: hidden;
        }

        /* Capa de Entrada com Imagem Grande Ocupando a Tela Toda */
        .tela-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            cursor: pointer;
        }

        .tela-capa img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cobre a tela inteira perfeitamente */
        }

        /* Painel de Login e Inscrição (Aparece após o toque) */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #ffffff;
        }

        .painel-acesso {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            border: 1px solid #cbd5e1;
        }

        .painel-acesso h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .input-grupo {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-grupo label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-grupo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .botao-acao {
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .links-uteis {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .links-uteis span {
            color: #1e3a8a;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        .escondido {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Capa de Entrada com Logo em Tela Cheia -->
    <div class="tela-capa" id="telaCapa" onclick="entrarNoApp()">
        <img src="logo.jpg" alt="Kadoshflow Capa" onerror="this.onerror=null; this.src='Logo.jpg';">
    </div>

    <!-- Painel de Login e Inscrição -->
    <div class="app-container">
        <div class="painel-acesso">
            <div id="formEntrar">
                <h2>Kadoshflow</h2>
                <div class="input-grupo">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                <div class="input-grupo">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Sua senha">
                </div>
                
                <button class="botao-acao" onclick="realizarLogin()">Entrar</button>

                <div class="links-uteis">
                    <span onclick="alternarTela('cadastro')">Ainda não tem conta? Inscrever-se</span>
                    <span style="color: #64748b; font-weight: normal;" onclick="irParaVitrineLivre()">Pular para a Vitrine (Modo Visitante)</span>
                </div>
            </div>

            <div id="formCadastro" class="escondido">
                <h2>Criar Conta Gratuita</h2>
                <div class="input-grupo">
                    <label>E-mail</label>
                    <input type="email" id="cadEmail" placeholder="seu@email.com">
                </div>
                <div class="input-grupo">
                    <label>Criar Senha</label>
                    <input type="password" id="cadSenha" placeholder="Sua senha">
                </div>
                <div class="input-grupo">
                    <label>Confirmar Senha</label>
                    <input type="password" id="cadConfirmaSenha" placeholder="Repita a senha">
                </div>
                
                <button class="botao-acao" onclick="realizarCadastro()">Concluir Inscrição</button>

                <div class="links-uteis">
                    <span onclick="alternarTela('entrar')">Já tem uma conta? Entrar</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function entrarNoApp() {
            document.getElementById('telaCapa').classList.add('escondido');
        }

        function alternarTela(tipo) {
            const fEntrar = document.getElementById('formEntrar');
            const fCadastro = document.getElementById('formCadastro');
            if(tipo === 'cadastro') {
                fEntrar.classList.add('escondido');
                fCadastro.classList.remove('escondido');
            } else {
                fCadastro.classList.add('escondido');
                fEntrar.classList.remove('escondido');
            }
        }

        function realizarCadastro() {
            const email = document.getElementById('cadEmail').value.trim();
            const senha = document.getElementById('cadSenha').value;
            if(!email || !senha) { alert("Preencha todos os campos."); return; }
            localStorage.setItem('kadoshflow_email', email);
            window.location.href = 'vitrine.html';
        }

        function realizarLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            if(!email) { alert("Digite seu e-mail."); return; }
            localStorage.setItem('kadoshflow_email', email);
            window.location.href = 'vitrine.html';
        }

        function irParaVitrineLivre() {
            window.location.href = 'vitrine.html';
        }
    </script>
</body>
</html>
